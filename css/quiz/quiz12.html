<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 700px;
            height: 500px;

            margin:0 auto;
            margin-top: 50px;

            border: 1px solid black;
        }


        /* ---------- 상단 Header 영역 스타일 - 시작 -----------*/

        .header {
            height: 100px;
            /* background-color: lightblue; */
            /* overflow: hidden; */
            display: flex;
            justify-content: space-between;
        }

        .main-menu {
            width:200px;
            height:100px;
            background-color: red;

            /* color:white;
            display: flex;
            justify-content: center;
            align-items: center; */
        }

        .mypage {
            width:100px;
            height:100px;
            background-color: red;

            
        }

        /* ---------- 상단 Header 영역 스타일 - 끝 -----------*/


        /* ---------- 가운데 Main 영역 스타일 - 시작 -----------*/

        .main {
            height: 300px;
            background-color: lightblue;
            display: flex;
        }

        .section {
            height: 300px;
            background-color: orange;
            width: 70%;

            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            /* align-items: center; */
            align-content: center;
        }

        .article {
            width:100px;
            height: 50px;
            background-color: black;
            margin: 30px;

            transition-duration: 1s;
            /* transition-property: transform; */
            transition-property: all;
        }

        .article:hover {
            /* width:140px;
            height:70px;
            margin:10px; */
            /* transform:scale(1.4, 1.4); x축 크기, y축 크기 */
            transform:scale(1.4);  /* x축 + y축 크기  */
        }



        .aside {
            background-color: green;
            height:300px;
            width: 30%;
        }


        /* ---------- 가운데 Main 영역 스타일 - 끝 -----------*/


        .footer {
            background-color: blue;
            height: 100px;
        }

        /* ------------------------------------*/

        /* 글자색 흰색 */
        .color-white {
            color: white;
        }

        /* 요소 가운데정렬 (주축+교차축) */
        .align-center {
            display: flex;
            justify-content: center;
            align-items: center; 
        }
        


    </style>
</head>
<body>
    
    <div class="container">

        <div class="header">
            <div class="main-menu color-white align-center">메인메뉴</div>
            <div class="mypage color-white align-center">마이페이지</div>
        </div>

        <div class="main">
            
            <div class="section">

                <div class="article"></div>
                <div class="article"></div>
                <div class="article"></div>
                <div class="article"></div>
                <div class="article"></div>
                <div class="article"></div>

            </div>

            <div class="aside color-white align-center">aside</div>
        </div>

        <div class="footer color-white align-center">footer</div>
        

    </div>

</body>
</html>
